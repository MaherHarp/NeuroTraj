name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  minimum-dependencies:
    # Guards the lower bounds declared in pyproject.toml.
    name: tests (minimum dependency versions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.10
      - run: uv pip install --resolution lowest-direct -e ".[test]"
      - run: .venv/bin/python -m pytest

  static:
    name: mypy and ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy
      - run: python -m ruff check src tests examples

  openmm:
    name: OpenMM integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[md,test]"
      - name: python -m pytest -m openmm
        # A stalled test dumps every thread's stack after 10 minutes instead of hanging silently.
        run: python -m pytest -m openmm -v --durations=0 -o faulthandler_timeout=600

  build:
    name: build and test the sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Run the test suite from the unpacked sdist against the built wheel
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          mkdir sdist && tar xzf dist/*.tar.gz -C sdist --strip-components=1
          cd sdist && rm -rf src && python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
